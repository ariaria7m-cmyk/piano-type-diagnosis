<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3〜5歳 ピアノ・音楽タイプ診断</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #fef5e7 0%, #f9e79f 100%);
      color: #2c3e50;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .quiz-screen,
    .result-screen {
      padding: 2rem;
    }

    .hidden {
      display: none;
    }

    .header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }

    .header-subtitle {
      font-size: 13px;
      color: #7f8c8d;
      line-height: 1.5;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #ecf0f1;
      border-radius: 2px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #f39c12;
      transition: width 0.3s ease;
    }

    .question-number {
      font-size: 12px;
      color: #95a5a6;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .question-text {
      font-size: 15px;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 1rem;
      line-height: 1.5;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border: 1px solid #ecf0f1;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.15s ease;
      font-family: inherit;
      color: #2c3e50;
    }

    .option-btn:hover {
      background: #fef9e7;
      border-color: #f39c12;
    }

    .option-btn.selected {
      background: #fef5e7;
      border-color: #f39c12;
      color: #2c3e50;
      font-weight: 500;
    }

    .button-group {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-top: 2rem;
    }

    button {
      padding: 10px 16px;
      border: 1px solid #bdc3c7;
      border-radius: 6px;
      background: white;
      color: #2c3e50;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #f8f9fa;
      border-color: #f39c12;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .primary-btn {
      background: #f39c12;
      color: white;
      border-color: #f39c12;
    }

    .primary-btn:hover:not(:disabled) {
      background: #e67e22;
      border-color: #e67e22;
    }

    .result-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .result-emoji {
      font-size: 40px;
      margin-bottom: 0.5rem;
    }

    .result-type-name {
      font-size: 20px;
      font-weight: 600;
      color: #f39c12;
      margin-bottom: 1rem;
    }

    .type-intro {
      background: #fef9e7;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 13px;
      line-height: 1.6;
      color: #2c3e50;
      border-left: 4px solid #f39c12;
    }

    .result-section {
      margin-bottom: 1.5rem;
    }

    .result-section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #95a5a6;
      margin-bottom: 0.75rem;
      letter-spacing: 0.5px;
    }

    .result-card {
      background: #f8f9fa;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid #ecf0f1;
      font-size: 13px;
      line-height: 1.8;
      color: #2c3e50;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .reset-btn {
      width: 100%;
      margin-top: 0;
    }

    @media (max-width: 480px) {
      .quiz-screen,
      .result-screen {
        padding: 1.5rem;
      }

      .header-title {
        font-size: 16px;
      }

      .question-text {
        font-size: 14px;
      }

      .option-btn {
        font-size: 13px;
        padding: 11px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="quiz-screen" id="quizScreen">
      <div class="header">
        <div class="header-title">🎵 3〜5歳向け 音楽タイプ診断</div>
        <div class="header-subtitle">お子さんの様子を観察して、その子らしい関わり方を見つけよう</div>
      </div>

      <div class="progress-bar">

      <div class="question-number" id="questionNum"></div>
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>

      <div class="button-group">
        <button id="prevBtn" onclick="previousQuestion()" style="display: none;">← 戻る</button>
        <button class="primary-btn" id="nextBtn" onclick="nextQuestion()" disabled>次へ →</button>
      </div>
    </div>

    <div class="result-screen hidden" id="resultScreen">
      <div class="result-header">
        <div class="result-emoji" id="resultEmoji"></div>
        <div class="result-type-name" id="resultTypeName"></div>
      </div>

      <div class="type-intro" id="typeIntro"></div>

      <div class="result-section">

        <div class="result-card" id="characteristics"></div>
      </div>

      <div class="result-section">

      </div>

      <div class="result-section">

        <div class="result-card" id="lessonTips"></div>
      </div>

      <div class="button-group">
        <button class="primary-btn reset-btn" onclick="resetQuiz()">もう一度診断する</button>
      </div>
    </div>
  </div>

      3: {

        parentApproach: "• 小さな目標を一緒に設定する\n• 上達を見える化する（シール制度など）\n• プロセスだけでなく成果も褒める\n• 挑戦することの大切さを伝える",

    let currentQuestion = 0;
    let selectedAnswers = [];

    function render() {
      const q = questions[currentQuestion];
      const progress = (currentQuestion / questions.length) * 100;

      document.getElementById("progressFill").style.width = progress + "%";
      document.getElementById("questionNum").textContent =
        `質問 ${currentQuestion + 1} / ${questions.length}`;
      document.getElementById("questionText").textContent = q.text;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      q.options.forEach((option) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        if (selectedAnswers[currentQuestion] === option.type) {
          btn.classList.add("selected");
        }
        btn.textContent = option.text;
        btn.onclick = () => selectOption(option.type);
        container.appendChild(btn);
      });

      updateButtons();
    }

    function selectOption(typeNum) {
      selectedAnswers[currentQuestion] = typeNum;
      render();
    }

    function updateButtons() {
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");

      prevBtn.style.display = currentQuestion === 0 ? "none" : "block";
      nextBtn.disabled = selectedAnswers[currentQuestion] === undefined;
      nextBtn.textContent =
        currentQuestion === questions.length - 1 ? "診断結果を見る" : "次へ →";
    }

    function nextQuestion() {
      if (selectedAnswers[currentQuestion] === undefined) return;

      if (currentQuestion < questions.length - 1) {
        currentQuestion++;
        render();
      } else {
        showResults();
      }
    }

    function previousQuestion() {
      if (currentQuestion > 0) {
        currentQuestion--;
        render();
      }
    }

    function showResults() {
      const scores = {};
      for (let i = 1; i <= 9; i++) scores[i] = 0;

      selectedAnswers.forEach((type) => {
        if (type) scores[type]++;
      });

      const resultType = Object.keys(scores).reduce((a, b) =>
        scores[a] > scores[b] ? a : b
      );
      const profile = typeProfiles[resultType];

      document.getElementById("resultEmoji").textContent = profile.emoji;
      document.getElementById("resultTypeName").textContent = profile.name;
      document.getElementById("typeIntro").textContent = profile.intro;
      document.getElementById("characteristics").textContent = profile.characteristics;
      document.getElementById("parentApproach").textContent = profile.parentApproach;
      document.getElementById("lessonTips").textContent = profile.lessonTips;

      document.getElementById("quizScreen").classList.add("hidden");
      document.getElementById("resultScreen").classList.remove("hidden");
    }

    function resetQuiz() {
      currentQuestion = 0;
      selectedAnswers = [];
      document.getElementById("quizScreen").classList.remove("hidden");
      document.getElementById("resultScreen").classList.add("hidden");
      render();
    }

    render();
  </script>
